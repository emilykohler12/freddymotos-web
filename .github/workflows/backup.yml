name: Backup semanal de la base

# Copia toda la base de Neon una vez por semana, la cifra con la contraseña del
# secret BACKUP_PASSPHRASE y la guarda 90 días como artifact. El repo es público:
# cualquiera puede descargar el archivo, pero sin la contraseña no se puede leer.
#
# Para recuperar una copia (desde Git Bash):
#   1. Actions → "Backup semanal de la base" → elegir la corrida → descargar el artifact y descomprimirlo.
#   2. gpg --pinentry-mode loopback --decrypt -o freddymotos.dump freddymotos-AAAA-MM-DD.dump.gpg
#   3. Restaurar con pg_restore (versión 18) usando la conexión directa (DB_URL_MIGRATE).
on:
  schedule:
    - cron: '17 6 * * 1' # lunes 03:17 hora de Argentina (no en punto: a esa hora GitHub demora o descarta corridas)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar y cifrar la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Sin los dos secrets no se sube nada: nunca una copia sin cifrar.
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan los secrets DATABASE_URL y/o BACKUP_PASSPHRASE"
            exit 1
          fi
          file="freddymotos-$(date -u +%F).dump"
          # pg_dump tiene que ser de la misma versión que Neon (Postgres 18).
          docker run --rm -e DATABASE_URL postgres:18-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges' > "$file"
          # La copia tiene que traer datos de tablas; si no, falla y GitHub avisa por mail.
          docker run --rm -v "$PWD:/backup" postgres:18-alpine pg_restore --list "/backup/$file" | grep -q "TABLE DATA"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$file.gpg" "$file"
          rm "$file"
          echo "BACKUP_FILE=$file.gpg" >> "$GITHUB_ENV"

      - name: Guardar la copia cifrada
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
