name: Keep Render awake

# Render free tier duerme el servicio después de un rato sin tráfico.
# Esto lo despierta con una visita cada 10 minutos para que no se apague.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping la app en Render
        # Si igual llegó a dormirse, el arranque en frío (contenedor + migraciones +
        # primera petición) pasa los 30s: le damos hasta 2 minutos y reintenta si
        # corta por tiempo o Render devuelve 502/503/504.
        run: curl -sSf --max-time 120 --retry 2 --retry-delay 10 https://freddymotos.onrender.com/ > /dev/null
